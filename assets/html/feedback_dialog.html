<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="./feedback_dialog.css">
    <script src="./jquery.min.js"></script>
    <script src="./feedback_dialog.bin"></script>
  </head>
  <body oncontextmenu="return false;" class="hidden">
    <div id="main-layer">
      <div id="header">
        <img id="drive-logo" src="logo_drive_no_border.svg">
        <div id="header-text">
          <h1 tabindex="-1" class="title gmTypographyHeadline4 a11y-focusable-text"></h1>
          <div class="description gmTypographyBody2"></div>
        </div>
      </div>
      <div id="feedback-text-field"><!--- DFSTextField ---></div>
      <div id="legal-notice" class="gmTypographyBody2"><!-- Set by the JS. --></div>
      <div id="attach-logs-checkbox"><!-- DFSCheckbox --></div>
      <div id="user-consent-to-be-contacted-checkbox"><!-- DFSCheckbox --></div>
      <div id="footer">
        <div id="submit-in-progress-message" tabindex="-1"
             class="submit-message gmTypographyBody2 hidden"><!-- Set by the JS. --></div>
        <div id="submit-complete-message" tabindex="-1"
             class="submit-message gmTypographyBody2"><!-- Set by the JS. --></div>
        <div id="close-button"><!--- DFSButton ---></div>
        <div id="cancel-button"><!--- DFSButton ---></div>
        <div id="submit-button"><!--- DFSButton ---></div>
      </div>
    </div>
    <div id="additional-info-layer" class="hidden">
      <div id="additional-info-header">
        <div id="additional-info-back-button"><!--- DFSIconButton ---></div>
        <h1 id="additional-info-title" tabindex="-1" class="gmTypographyHeadline5 a11y-focusable-text"><!-- Set by the JS. --></h1>
      </div>
      <div id="additional-info-list">
        <div class="additional-info-list-item-template additional-info-list-item hidden">
          <div class="gmTypographyBody3 additional-info-list-item-key"></div>
          <div class="gmTypographyBody3 additional-info-list-item-value"></div>
        </div>
      </div>
    </div>
  </body>
</html>
