name: CI - Verificação Contínua e Pacote Debian

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Simulação e Testes de Integração
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1
          pip install -r requirements.txt

      - name: Executar Suíte de Simulação e Auditoria Ubuntu
        run: |
          python tests/simulation_suite.py
          python tests/audit_ubuntu_compatibility.py

  build-deb:
    name: Empacotar e Publicar Debian (.deb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Construir Pacote .deb
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          else
            TAG_VERSION="133.0.2"
          fi
          sed -i "s/Version: .*/Version: $TAG_VERSION/" packaging/debian/DEBIAN/control
          mkdir -p build/google-drive-linux/opt/google-drive-linux
          mkdir -p build/google-drive-linux/usr/local/bin
          mkdir -p build/google-drive-linux/usr/share/applications
          mkdir -p build/google-drive-linux/usr/lib/systemd/user
          mkdir -p build/google-drive-linux/DEBIAN

          cp -r core ui nautilus updater assets build/google-drive-linux/opt/google-drive-linux/
          cp main.py gdrive-cli gdrive-doc-launcher build/google-drive-linux/opt/google-drive-linux/
          cp gdrive-cli gdrive-doc-launcher build/google-drive-linux/usr/local/bin/
          cp packaging/desktop/google-drive.desktop build/google-drive-linux/usr/share/applications/
          cp packaging/systemd/google-drive.service build/google-drive-linux/usr/lib/systemd/user/
          cp -r packaging/debian/DEBIAN/* build/google-drive-linux/DEBIAN/

          chmod 755 build/google-drive-linux/DEBIAN/postinst
          dpkg-deb --build build/google-drive-linux google-drive-linux_${TAG_VERSION}_amd64.deb

      - name: Publicar Artefato .deb no Actions
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-linux-deb
          path: google-drive-linux_*.deb

      - name: Criar GitHub Release e Anexar .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: google-drive-linux_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
