name: Assign Copilot
on:
  issues:
    types: [labeled]
permissions:
  issues: write
jobs:
  assign:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check secret
        if: env.GH_TOKEN == ''
        run: echo "::warning::PAT_TOKEN não configurado; atribuição ignorada."
      - name: Assign Copilot
        if: env.GH_TOKEN != ''
        run: gh issue edit ${{ github.event.issue.number }} --add-assignee "@copilot"
